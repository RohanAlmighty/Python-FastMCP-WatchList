[project]
name = "mcp-server-watchlist"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for managing a movie watchlist, featuring LLM sampling for AI-generated summaries, interactive elicitation for user input, and tools/resources for adding, updating, and querying movies."
authors = [
    { name = "RohanAlmighty" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "aiomysql>=0.2.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.2.2",
    "mcp[cli]>=1.23.3",
    "pylint>=4.0.4",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "sqlalchemy>=2.0.41",
]

[project.scripts]
mcp-server-watchlist = "mcp_server_watchlist.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mcp_server_watchlist = ["templates/*.html"]
