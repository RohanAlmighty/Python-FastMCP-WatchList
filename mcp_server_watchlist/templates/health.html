<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist MCP Server - Health</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                         'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #263238;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 40px;
            text-align: center;
            max-width: 600px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            font-size: 40px;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .status-text {
            color: #81c784;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .section {
            background: #37474f;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        .section-title {
            color: #90caf9;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #455a64;
        }
        .item-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .item {
            background: #455a64;
            color: #eceff1;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        .footer {
            color: #78909c;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">🎬</div>
        <h1>Watchlist MCP Server</h1>
        <div class="status-text">✓ Healthy</div>
        
        <div class="section">
            <div class="section-title">Tools</div>
            <div class="item-list">
                {tools_html}
            </div>
        </div>

        <div class="section">
            <div class="section-title">Prompts</div>
            <div class="item-list">
                {prompts_html}
            </div>
        </div>

        <div class="section">
            <div class="section-title">Resources</div>
            <div class="item-list">
                {resources_html}
            </div>
        </div>

        <div class="footer">Movie Watchlist MCP Server • Model Context Protocol</div>
    </div>
</body>
</html>
